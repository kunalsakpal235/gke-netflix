apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: streaming-gateway
      namespace: streaming
  rules:
    - matches:
        - path: { type: PathPrefix, value: /argocd }
      backendRefs:
        - name: argocd-server
          port: 80
