apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: streaming-production, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/kunalsakpal235/gke-netflix.git
    targetRevision: production
    path: streaming-platform/charts/streaming
    helm:
      valueFiles: ["../../gitops/environments/production/values.yaml"]
  destination: { server: https://kubernetes.default.svc, namespace: streaming-production }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.tolerations[] | select(.key == "kubernetes.io/arch")'
