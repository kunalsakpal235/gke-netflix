apiVersion: v1
kind: Pod
spec:
  serviceAccountName: ci-builder
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1792Mi }
        limits: { ephemeral-storage: 1792Mi }
    - name: kaniko-push
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1792Mi }
        limits: { ephemeral-storage: 1792Mi }
    - name: tools
      image: alpine:3.20
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 1536Mi, ephemeral-storage: 1280Mi }
        limits: { cpu: 250m, memory: 1536Mi, ephemeral-storage: 1280Mi }
    - name: node
      image: node:20-alpine
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
        limits: { ephemeral-storage: 512Mi }
    - name: trivy
      image: aquasec/trivy:latest
      command: ["cat"]
      tty: true
      resources:
        # Estimated: no Java DB ever needed here, just the ~104MB vuln DB + a small
        # node:20-alpine-based img.tar. Never isolation-tested at this exact value.
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 768Mi }
        limits: { ephemeral-storage: 768Mi }
    - name: jnlp
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
  nodeSelector: { kubernetes.io/os: linux }
  restartPolicy: Never
  volumes: [{ name: workspace-volume, emptyDir: {} }]
