apiVersion: v1
kind: Pod
spec:
  serviceAccountName: ci-builder      # Workload-Identity-bound (see runbook Phase 9)
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1250Mi }
        limits: { ephemeral-storage: 1250Mi }
    - name: kaniko-push
      image: gcr.io/kaniko-project/executor:debug   # separate, fresh container - kaniko can't safely run twice in one
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1250Mi }
        limits: { ephemeral-storage: 1250Mi }
    - name: tools
      image: alpine:3.20               # holds git/yq/argocd-cli, all installed inline as needed
      command: ["cat"]
      tty: true
      resources:
        requests: { ephemeral-storage: 512Mi }
        limits: { ephemeral-storage: 512Mi }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      resources:
        requests: { ephemeral-storage: 1Gi }
        limits: { ephemeral-storage: 1Gi }
    - name: gradle
      image: gradle:8.9-jdk21-alpine   # catalog-service, user-service (Java)
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
    - name: node
      image: node:20-alpine            # frontend, api-gateway (Node.js) - matches their own Dockerfiles
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
        limits: { ephemeral-storage: 512Mi }
    - name: golang
      image: golang:1.22-alpine        # playback-service (Go) - matches its own Dockerfile
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
    - name: trivy
      image: aquasec/trivy:latest
      command: ["cat"]
      tty: true
      resources:
        # Trimmed from the previously-proven 5Gi to make room for the two new containers
        # above. 5Gi was CONFIRMED sufficient; 2Gi was CONFIRMED not enough; this value is
        # an untested calculated risk in between. If a future build hits the same
        # "exceeded ephemeral storage limit" eviction, bump this back toward 5Gi first.
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 4000Mi }
        limits: { ephemeral-storage: 4000Mi }
