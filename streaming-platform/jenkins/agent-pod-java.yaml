apiVersion: v1
kind: Pod
spec:
  serviceAccountName: ci-builder
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1280Mi }
        limits: { ephemeral-storage: 1280Mi }
    - name: kaniko-push
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1280Mi }
        limits: { ephemeral-storage: 1280Mi }
    - name: tools
      image: alpine:3.20
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
    - name: gradle
      image: gradle:8.9-jdk21-alpine
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
    - name: trivy
      image: aquasec/trivy:latest
      command: ["cat"]
      tty: true
      resources:
        # Bumped 4000Mi -> 5500Mi: evicted at exactly 4000Mi even though that value had
        # worked days earlier. Trivy's vulnerability databases update continuously - the
        # Java DB (measured at ~908MB this run) genuinely grows over time, so a value
        # proven sufficient once isn't permanently sufficient. This gives real margin
        # above the current measured size, not another razor-thin buffer.
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 5500Mi }
        limits: { ephemeral-storage: 5500Mi }
    - name: jnlp
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
  nodeSelector: { kubernetes.io/os: linux }
  restartPolicy: Never
  volumes: [{ name: workspace-volume, emptyDir: {} }]
