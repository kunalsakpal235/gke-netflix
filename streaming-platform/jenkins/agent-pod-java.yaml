apiVersion: v1
kind: Pod
spec:
  serviceAccountName: ci-builder
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        # Reverted to the genuinely-proven value. The earlier 1280Mi reduction was
        # never confirmed by a real successful build - reverting since trivy no
        # longer needs to borrow this space.
        requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 1536Mi }
        limits: { ephemeral-storage: 1536Mi }
    - name: kaniko-push
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 1536Mi }
        limits: { ephemeral-storage: 1536Mi }
    - name: tools
      image: alpine:3.20
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      resources:
        # Bumped 512Mi -> 640Mi proactively. Java never triggers the embedded Node
        # runtime that caused failures elsewhere, so risk here is genuinely lower -
        # still not isolation-tested at this exact value though.
        requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 100m, memory: 512Mi, ephemeral-storage: 512Mi }
    - name: gradle
      image: gradle:8.9-jdk21-alpine
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
    - name: trivy
      image: aquasec/trivy:latest
      command: ["cat"]
      tty: true
      resources:
        # Trimmed slightly from 5500Mi to make room for sonar-scanner's bump - still
        # far above the ~1.5-2GB realistic need (908MB Java DB + vuln DB + image).
        requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 5200Mi }
        limits: { ephemeral-storage: 5200Mi }
    - name: jnlp
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
  nodeSelector: { kubernetes.io/os: linux }
  restartPolicy: Never
  volumes: [{ name: workspace-volume, emptyDir: {} }]
