apiVersion: v1
kind: Pod
spec:
  serviceAccountName: ci-builder
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1536Mi }
        limits: { ephemeral-storage: 1536Mi }
    - name: kaniko-push
      image: gcr.io/kaniko-project/executor:debug
      command: ["/busybox/cat"]
      tty: true
      resources:
        requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1536Mi }
        limits: { ephemeral-storage: 1536Mi }
    - name: tools
      image: alpine:3.20
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      resources:
        # Estimated: pure Java analysis never triggers the embedded Node runtime that
        # forced this higher on the node template. Not isolation-tested at this exact
        # value - if it evicts, this is the first number to revisit.
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
        limits: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
    - name: gradle
      image: gradle:8.9-jdk21-alpine
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
    - name: trivy
      image: aquasec/trivy:latest
      command: ["cat"]
      tty: true
      resources:
        # Proven: exact value that handled the ~900MB Java DB repeatedly, no failures.
        requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 4000Mi }
        limits: { ephemeral-storage: 4000Mi }
    - name: jnlp
      resources:
        requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
        limits: { ephemeral-storage: 256Mi }
  nodeSelector: { kubernetes.io/os: linux }
  restartPolicy: Never
  volumes: [{ name: workspace-volume, emptyDir: {} }]
