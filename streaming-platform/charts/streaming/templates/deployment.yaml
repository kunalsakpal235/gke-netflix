{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: { app: {{ .name }} }
spec:
  replicas: {{ $.Values.replicaCount }}
  selector: { matchLabels: { app: {{ .name }} } }
  template:
    metadata: { labels: { app: {{ .name }} } }
    spec:
      serviceAccountName: {{ $.Values.serviceAccountName }}
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          ports: [{ containerPort: {{ .containerPort }} }]
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          startupProbe:  { httpGet: { path: {{ $.Values.probes.readiness }}, port: {{ .containerPort }} }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: {{ $.Values.probes.liveness }},  port: {{ .containerPort }} }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: {{ $.Values.probes.readiness }}, port: {{ .containerPort }} }, initialDelaySeconds: 5 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000                # ADD THIS LINE - satisfies restricted PSS on Autopilot
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      {{- if $.Values.spot }}
      nodeSelector: { cloud.google.com/gke-spot: "true" }
      tolerations:
        - { key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule }
      {{- end }}
{{- end }}
